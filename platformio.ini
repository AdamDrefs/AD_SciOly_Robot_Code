[env:bigtreetech_SKR_Pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board = rpipico
build_flags = -Wall -Wextra -D__FREERTOS=1
lib_extra_dirs = .
lib_deps = 
	https://github.com/gin66/FastAccelStepper.git
	janelia-arduino/TMC2209@^10.1.1
